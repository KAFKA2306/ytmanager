name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ytmanager
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test tools
        run: python -m pip install "pytest>=7" "ruff>=0.1"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest -q
