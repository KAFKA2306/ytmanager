name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ytmanager
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install "pytest>=7"
      - name: Compile comprehensive mode
        run: python -m py_compile src/content_modes.py tests/test_content_modes.py
      - name: Test comprehensive mode
        run: python -m pytest -q tests/test_content_modes.py
      - name: Verify clean working tree
        run: test -z "$(git status --porcelain)"
